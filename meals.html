<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Meals</title>

  <link rel="stylesheet" href="css/style.css">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container py-5">

  <h1 class="text-center mb-4">🍽️ Our Healthy Meals</h1>

  <!-- FILTERS -->
  <div class="row mb-4">

    <div class="col-md-4">
      <input type="text" id="searchInput" class="form-control" placeholder="Search meals...">
    </div>

    <div class="col-md-4">
      <select id="dietFilter" class="form-select">
        <option value="">All Diets</option>
        <option value="vegan">Vegan</option>
        <option value="keto">Keto</option>
        <option value="high-protein">High Protein</option>
      </select>
    </div>

  </div>

  <!-- MEALS -->
  <div class="row" id="mealContainer"></div>

</div>

<script src="js/meals.js"></script>
<script src="js/filters.js"></script>

</body>
</html>
